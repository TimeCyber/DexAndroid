<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>大麦流程 Mock 演示客户端</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="modeBanner" class="banner">
      <strong>MOCK 层已开启</strong> — 请求打到本地 Mock 网关，不会产生真实订单。
    </div>

    <header class="top">
      <div class="brand">
        <h1>选座下单流程演示</h1>
        <p>短信登录 → Token → 项目场次 → 选票档 → 建单 → 支付（按大麦 /gw/&lt;api&gt;/&lt;v&gt;/）</p>
      </div>
      <div class="top-right">
        <label class="mock-toggle" title="关闭后按前缀直连，不再走本地 Mock 响应">
          <input type="checkbox" id="mockLayerToggle" checked />
          <span>启用 Mock 层</span>
        </label>
        <label class="prefix-box">
          <span>接口前缀</span>
          <input
            id="apiPrefix"
            type="text"
            spellcheck="false"
            placeholder="Mock 留空用本机；直连留空用 https://mtop.damai.cn"
            title="最终请求 = 前缀 + /gw/&lt;api&gt;/&lt;v&gt;/"
          />
        </label>
        <div id="prefixHint" class="prefix-hint"></div>
        <div id="sessionChip" class="session-chip">未登录</div>
      </div>
    </header>

    <nav id="steps" class="steps" aria-label="流程步骤"></nav>

    <main class="layout">
      <section class="panel">
        <div class="panel-hd">
          <h2 id="mainTitle">主面板</h2>
          <span id="mainSub">-</span>
        </div>
        <div class="panel-bd" id="mainBd"></div>
        <div class="panel-ft" id="mainFt"></div>
      </section>

      <section class="panel log-panel">
        <div class="panel-hd">
          <h2>API 日志</h2>
          <button type="button" class="btn ghost" id="btnClearLog" style="padding: 4px 10px; font-size: 12px">
            清空
          </button>
        </div>
        <div class="panel-bd">
          <pre id="apiLog" class="log-empty">等待操作…每行一条接口结果。</pre>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
